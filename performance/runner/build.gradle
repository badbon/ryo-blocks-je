plugins {
    id "fabric-loom" version "1.10-SNAPSHOT"
}

base { archivesName = "ryo-performance-runner" }

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:0.19.3"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.9+1.20.1"
}

loom {
    runs {
        benchmarkClient {
            client()
            runDir project.findProperty("ryoPerformance.profile") ?: "../../performance-runs/runner"
            ["enabled":"true", "output":project.findProperty("ryoPerformance.output"), "profile":project.findProperty("ryoPerformance.profile"), "variant":project.findProperty("ryoPerformance.variant"), "runId":project.findProperty("ryoPerformance.runId"), "warmupSeconds":project.findProperty("ryoPerformance.warmupSeconds") ?: "20", "measurementSeconds":project.findProperty("ryoPerformance.measurementSeconds") ?: "60", "metadata":project.findProperty("ryoPerformance.metadata")].each { key, value -> if (value != null) property "ryoPerformance.${key}", value.toString() }
        }
        standaloneProofClient {
            client()
            runDir "../../performance-runs/standalone-proof"
            property "ryoBlocks.visualProof", "true"
        }
    }
}
