plugins {
    id "fabric-loom" version "1.10-SNAPSHOT"
}

version = "1.0.0"
group = "private.ryoblocks.performance"

base { archivesName = "ryo-performance-harness" }

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:0.19.3"
    modImplementation fabricApi.module("fabric-api-base", "0.92.9+1.20.1")
    modImplementation fabricApi.module("fabric-lifecycle-events-v1", "0.92.9+1.20.1")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 17 }
