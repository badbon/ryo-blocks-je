plugins {
    id "fabric-loom" version "1.10-SNAPSHOT"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    runs {
        client {
            if (project.hasProperty("visualProof")) {
                property "ryoBlocks.visualProof", "true"
            }
            if (project.hasProperty("bossVisualProof")) {
                property "ryoBlocks.visualProof", "true"
                property "ryoBlocks.bossVisualProof", "true"
            }
        }
    }

    mods {
        "ryo-blocks" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation include(fabricApi.module("fabric-api-base", project.fabric_api_version))
    modImplementation include(fabricApi.module("fabric-blockrenderlayer-v1", project.fabric_api_version))
    modImplementation include(fabricApi.module("fabric-item-group-api-v1", project.fabric_api_version))
    modImplementation include(fabricApi.module("fabric-lifecycle-events-v1", project.fabric_api_version))
    modImplementation include(fabricApi.module("fabric-object-builder-api-v1", project.fabric_api_version))
    modImplementation include(fabricApi.module("fabric-registry-sync-v0", project.fabric_api_version))
    modImplementation include(fabricApi.module("fabric-rendering-v1", project.fabric_api_version))
    modImplementation include(fabricApi.module("fabric-resource-loader-v0", project.fabric_api_version))
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.register("verifyWolfCollarMixinRefmap") {
    dependsOn remapJar

    doLast {
        def outputJar = remapJar.archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(outputJar)
        try {
            def entry = zip.getEntry("client-ryo-blocks-refmap.json")
            if (entry == null) {
                throw new GradleException("Missing client mixin refmap in ${outputJar.name}")
            }

            def refmap = zip.getInputStream(entry).getText("UTF-8")
            def expectedTarget = "Lnet/minecraft/class_1006;method_23199"
            if (!refmap.contains(expectedTarget)) {
                throw new GradleException(
                    "Wolf collar mixin does not target the runtime WolfCollarFeatureRenderer owner"
                )
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register("verifyCustomBossCommonEntrypoint") {
    dependsOn remapJar

    doLast {
        def outputJar = remapJar.archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(outputJar)
        try {
            def metadataEntry = zip.getEntry("fabric.mod.json")
            if (metadataEntry == null) {
                throw new GradleException("Missing fabric.mod.json in ${outputJar.name}")
            }

            def metadata = new groovy.json.JsonSlurper().parse(
                zip.getInputStream(metadataEntry),
                "UTF-8"
            )
            if (metadata.environment != "*") {
                throw new GradleException("Ryo Blocks must declare common environment for the custom boss entity")
            }
            if (metadata.entrypoints?.main != ["com.go4no.ryoblocks.RyoBlocks"]) {
                throw new GradleException("Ryo Blocks must register its custom entity from the common entrypoint")
            }
            if (zip.getEntry("com/go4no/ryoblocks/entity/PaSanEndermanEntity.class") != null) {
                throw new GradleException("Pa-san Enderman must remain a vanilla Enderman renderer, not a custom entity")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register("verifyStandaloneFabricModules") {
    dependsOn remapJar

    doLast {
        def outputJar = remapJar.archiveFile.get().asFile
        def expectedModuleIds = [
            "fabric-api-base",
            "fabric-blockrenderlayer-v1",
            "fabric-item-group-api-v1",
            "fabric-lifecycle-events-v1",
            "fabric-object-builder-api-v1",
            "fabric-registry-sync-v0",
            "fabric-rendering-v1",
            "fabric-resource-loader-v0"
        ] as Set
        def requiredProductEntries = [
            "com/go4no/ryoblocks/RyoBlocksClient.class",
            "com/go4no/ryoblocks/entity/KitaAngelBossEntity.class",
            "com/go4no/ryoblocks/client/KitaAngelBossRenderer.class",
            "assets/ryo-blocks/textures/entity/player/kita_angel.png",
            "assets/ryo-blocks/textures/entity/boss/kita_angel_wings.png",
            "com/go4no/ryoblocks/client/RyoTerrainShaders.class",
            "com/go4no/ryoblocks/mixin/client/GameRendererMixin.class",
            "resourcepacks/ryo_blocks/pack.mcmeta",
            "resourcepacks/ryo_blocks_renderer_compat/pack.mcmeta",
            "resourcepacks/ryo_blocks_renderer_compat/assets/minecraft/textures/ryo-blocks-renderer-compat-summary.json",
            "resourcepacks/ryo_blocks_renderer_compat/assets/minecraft/textures/block/stone.png",
            "resourcepacks/ryo_blocks/assets/minecraft/shaders/core/rendertype_solid.fsh",
            "resourcepacks/ryo_blocks/assets/ryo-blocks/textures/terrain/ryo_overlay.png"
        ]
        def forbiddenArtifact = ~/(?i).*(iris|sodium|indium|optifine|shaderpack).*/
        def zip = new java.util.zip.ZipFile(outputJar)
        try {
            def metadataEntry = zip.getEntry("fabric.mod.json")
            if (metadataEntry == null) {
                throw new GradleException("Missing root fabric.mod.json in ${outputJar.name}")
            }
            def metadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(metadataEntry), "UTF-8")
            def rootDependencyIds = (metadata.depends ?: [:]).keySet() as Set
            def expectedRootDependencyIds = expectedModuleIds + ["fabricloader", "minecraft", "java"] as Set
            if (rootDependencyIds != expectedRootDependencyIds) {
                throw new GradleException("Root metadata must contain exactly ${expectedRootDependencyIds}, found ${rootDependencyIds}")
            }

            requiredProductEntries.each { entryName ->
                if (zip.getEntry(entryName) == null) {
                    throw new GradleException("Missing packaged product entry ${entryName}")
                }
            }

            def nestedEntries = zip.entries().findAll { entry ->
                !entry.directory && entry.name.startsWith("META-INF/jars/") && entry.name.endsWith(".jar")
            }
            if (nestedEntries.size() != expectedModuleIds.size()) {
                throw new GradleException("Expected exactly ${expectedModuleIds.size()} nested module jars, found ${nestedEntries.size()}")
            }

            def nestedModuleIds = [] as Set
            nestedEntries.each { nestedEntry ->
                if (nestedEntry.name ==~ forbiddenArtifact) {
                    throw new GradleException("Forbidden external runtime artifact in product jar: ${nestedEntry.name}")
                }
                def nestedZip = new java.util.zip.ZipInputStream(zip.getInputStream(nestedEntry))
                try {
                    def nestedMetadataCount = 0
                    java.util.zip.ZipEntry entry
                    while ((entry = nestedZip.nextEntry) != null) {
                        if (entry.name == "fabric.mod.json") {
                            nestedMetadataCount++
                            def nestedMetadata = new groovy.json.JsonSlurper().parseText(new String(nestedZip.readAllBytes(), "UTF-8"))
                            nestedModuleIds.add(nestedMetadata.id as String)
                        }
                    }
                    if (nestedMetadataCount != 1) {
                        throw new GradleException("Nested artifact ${nestedEntry.name} must contain exactly one fabric.mod.json, found ${nestedMetadataCount}")
                    }
                } finally {
                    nestedZip.close()
                }
            }
            if (nestedModuleIds.size() != expectedModuleIds.size() || nestedModuleIds != expectedModuleIds) {
                throw new GradleException("Expected only nested Fabric API module IDs ${expectedModuleIds}, found ${nestedModuleIds}")
            }

            zip.entries().findAll { entry -> !entry.directory && entry.name ==~ forbiddenArtifact }.each { entry ->
                throw new GradleException("Forbidden external runtime artifact in product jar: ${entry.name}")
            }
        } finally {
            zip.close()
        }
    }
}

check.dependsOn verifyWolfCollarMixinRefmap, verifyCustomBossCommonEntrypoint, verifyStandaloneFabricModules
