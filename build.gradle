plugins {
    id "fabric-loom" version "1.10-SNAPSHOT"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "ryo-blocks" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.register("verifyWolfCollarMixinRefmap") {
    dependsOn remapJar

    doLast {
        def outputJar = remapJar.archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(outputJar)
        try {
            def entry = zip.getEntry("client-ryo-blocks-refmap.json")
            if (entry == null) {
                throw new GradleException("Missing client mixin refmap in ${outputJar.name}")
            }

            def refmap = zip.getInputStream(entry).getText("UTF-8")
            def expectedTarget = "Lnet/minecraft/class_1006;method_23199"
            if (!refmap.contains(expectedTarget)) {
                throw new GradleException(
                    "Wolf collar mixin does not target the runtime WolfCollarFeatureRenderer owner"
                )
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register("verifyVanillaServerCompatibility") {
    dependsOn remapJar

    doLast {
        def outputJar = remapJar.archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(outputJar)
        try {
            def metadataEntry = zip.getEntry("fabric.mod.json")
            if (metadataEntry == null) {
                throw new GradleException("Missing fabric.mod.json in ${outputJar.name}")
            }

            def metadata = new groovy.json.JsonSlurper().parse(
                zip.getInputStream(metadataEntry),
                "UTF-8"
            )
            if (metadata.environment != "client") {
                throw new GradleException("Ryo Blocks must remain client-only")
            }
            if (metadata.entrypoints?.main) {
                throw new GradleException("Server/common entrypoint would break vanilla-only behavior")
            }
            if (zip.getEntry("com/go4no/ryoblocks/entity/PaSanEndermanEntity.class") != null) {
                throw new GradleException("Custom Pa-san entity must not ship in the client-only artifact")
            }
        } finally {
            zip.close()
        }
    }
}

check.dependsOn verifyWolfCollarMixinRefmap, verifyVanillaServerCompatibility
